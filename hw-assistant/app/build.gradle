plugins {
    id 'com.android.application'
}
android {
    namespace 'dev.cihan.gmshwassistant'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.cihan.gmshwassistant'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
