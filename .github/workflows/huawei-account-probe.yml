name: Huawei microG account visibility (read-only probe)
on:
  push:
    branches: [experiment/huawei-account-visibility-v1]
    paths:
      - 'experiments/huawei-account-probe/**'
      - '.github/workflows/huawei-account-probe.yml'
  pull_request:
    paths:
      - 'experiments/huawei-account-probe/**'
      - '.github/workflows/huawei-account-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Android platform 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build read-only standalone diagnostics APK
        run: gradle -p experiments/huawei-account-probe --no-daemon :app:assembleDebug
      - name: Verify output and print digest
        run: |
          set -euo pipefail
          APK=experiments/huawei-account-probe/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK"
          keytool -printcert -jarfile "$APK" | grep -E 'Owner:|SHA256:'
      - name: Upload independent APK
        uses: actions/upload-artifact@v4
        with:
          name: huawei-account-probe-readonly-debug
          path: experiments/huawei-account-probe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
