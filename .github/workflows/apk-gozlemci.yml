name: APK Gozlemci Build

on:
  push:
    branches: [apk-gozlemci]
    paths:
      - 'tools/apk-gozlemci/**'
      - '.github/workflows/apk-gozlemci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon --project-dir tools/apk-gozlemci assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: huawei-apk-gozlemci-debug
          path: tools/apk-gozlemci/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
