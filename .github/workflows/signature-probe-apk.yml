name: Signature Probe APK
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "tools/PackageManagerSignatureProbe_v1.0_source.zip"
      - ".github/workflows/signature-probe-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not present in the Ubuntu runner"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract source archive
        run: unzip -t tools/PackageManagerSignatureProbe_v1.0_source.zip && unzip -q tools/PackageManagerSignatureProbe_v1.0_source.zip -d probe-src
      - name: Build APK
        working-directory: probe-src/PackageManagerSignatureProbe
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK and source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: signature-probe-apk-and-source
          path: |
            probe-src/PackageManagerSignatureProbe/app/build/outputs/apk/debug/app-debug.apk
            tools/PackageManagerSignatureProbe_v1.0_source.zip
          if-no-files-found: error
