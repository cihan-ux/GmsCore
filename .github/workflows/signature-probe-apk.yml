name: Signature Probe APK
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "tools/PackageManagerSignatureProbe_v1.0_source.zip"
      - ".github/workflows/signature-probe-apk.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract uploaded source ZIP
        run: unzip -q tools/PackageManagerSignatureProbe_v1.0_source.zip -d probe-src
      - name: Build APK from uploaded ZIP
        working-directory: probe-src/PackageManagerSignatureProbe
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: signature-probe-apk-and-source
          path: |
            probe-src/PackageManagerSignatureProbe/app/build/outputs/apk/debug/app-debug.apk
            tools/PackageManagerSignatureProbe_v1.0_source.zip
