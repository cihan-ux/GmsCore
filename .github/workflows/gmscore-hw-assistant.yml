name: GmsCore HW Assistant - APK

on:
  push:
    branches: [gmscore-hw-assistant-v1]
    paths:
      - 'hw-assistant/**'
      - '.github/workflows/gmscore-hw-assistant.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-assistant:
    name: Unit tests and signed Android 10 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Run rules tests and assemble debug
        run: gradle -p hw-assistant :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Verify package and signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="hw-assistant/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" \
            | grep -q "^package: name='dev.cihan.gmshwassistant'"
          cp "$apk" dist/GmsCore-HW-Assistant-v1-DEBUG.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            dist/GmsCore-HW-Assistant-v1-DEBUG.apk > dist/SIGNATURE.txt
          (cd dist && sha256sum GmsCore-HW-Assistant-v1-DEBUG.apk > SHA256SUMS.txt)
          (cd dist && sha256sum -c SHA256SUMS.txt)
          echo '## GmsCore HW Assistant v1.0' >> "$GITHUB_STEP_SUMMARY"
          echo '- APK package: dev.cihan.gmshwassistant (independent from GmsCore)' >> "$GITHUB_STEP_SUMMARY"
          echo '- Android 10+; no network, accounts, root or log permissions' >> "$GITHUB_STEP_SUMMARY"
          echo '- Unit tests passed and APK cryptographic signature verified' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GmsCore-HW-Assistant-v1-DEBUG
          path: dist/*
          if-no-files-found: error
          retention-days: 21
