name: "microG Huawei account visibility - experimental"
on:
  push:
    branches:
      - experiment/huawei-account-visibility-v1
    paths:
      - "play-services-core/src/main/kotlin/org/microg/gms/ui/AccountsFragment.kt"
      - ".github/workflows/huawei-account-visibility-build.yml"
      - "docs/huawei-microg-account-visibility.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-huawei-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: 1

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile Huawei (Mapbox) debug variant
        run: ./gradlew :play-services-core:assembleMapboxHuaweiDebug --stacktrace
      - name: Upload unsigned test build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: microg-huawei-account-visibility-debug
          path: play-services-core/build/outputs/apk/mapboxHuawei/debug/*.apk
          if-no-files-found: error
          retention-days: 7
