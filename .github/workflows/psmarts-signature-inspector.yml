name: P Smart S Signature Inspector APK
on:
  push:
    branches: [experiment/psmarts-live-events]
    paths: ['tools/psmarts-signature-inspector/**', '.github/workflows/psmarts-signature-inspector.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/psmarts-signature-inspector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: psmarts-signature-inspector-debug-apk
          path: tools/psmarts-signature-inspector/app/build/outputs/apk/debug/app-debug.apk
