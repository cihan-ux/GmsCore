name: Huawei GmsCore isolated build

on:
  workflow_dispatch:
  push:
    branches:
      - research/p-smart-s-native-login
    paths:
      - '.github/workflows/huawei-isolated-build.yml'
      - 'play-services-core/**'
      - 'build.gradle'
      - 'settings.gradle'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: '1'
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle wrapper permissions
        run: chmod +x ./gradlew
      - name: Assemble isolated user flavor (no device installation)
        run: ./gradlew :play-services-core:assembleUserMapboxDebug --no-daemon --max-workers=2 --stacktrace
      - name: Upload unsigned/development APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gmscore-user-mapbox-debug-research
          path: play-services-core/build/outputs/apk/user/mapbox/debug/*.apk
          if-no-files-found: error
          retention-days: 7
