name: Publish Huawei Samsung read-only account comparison probe v0.4

on:
  push:
    branches:
      - distribution/dual-device-account-probe-v04
    paths:
      - ".github/workflows/publish-dual-device-account-probe.yml"
      - "experiments/huawei-account-probe/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out public distribution branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build only standalone account probe
        run: gradle -p experiments/huawei-account-probe --no-daemon :app:assembleDebug
      - name: Verify package, signature, version and no Internet permission
        run: |
          set -euo pipefail
          APK="experiments/huawei-account-probe/app/build/outputs/apk/debug/app-debug.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | grep -m 1 "^package: name='dev.cihan.microg.accountprobe'"
          "$BT/aapt" dump badging "$APK" | grep -m 1 "versionName='0.4'"
          if "$BT/aapt" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo "Unexpected INTERNET permission; refusing to publish" >&2
            exit 1
          fi
          mkdir -p downloads
          cp "$APK" downloads/huawei-samsung-account-probe-v04.apk
          (cd downloads && sha256sum huawei-samsung-account-probe-v04.apk > huawei-samsung-account-probe-v04.SHA256SUMS.txt)
          cat > downloads/README-ACCOUNT-PROBE-V04.txt <<'EOF'
          Huawei/Samsung read-only account comparison probe 0.4
          Package: dev.cihan.microg.accountprobe
          Requires Android 10+; supports LineageOS Android 11.
          No INTERNET permission; does not modify, remove, or sign in accounts.
          If an older probe fails to update because CI uses a different
          signing key, uninstall ONLY microG Account Probe, not microG.
          Google account counts are scoped ONLY to this diagnostic package.
          The signature-spoofing permission is a hint, NOT a definitive test.
          No account names, e-mail addresses, passwords or tokens are reported.
          EOF
      - name: Publish APK and SHA-256 as public direct-download files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/huawei-samsung-account-probe-v04.apk downloads/huawei-samsung-account-probe-v04.SHA256SUMS.txt downloads/README-ACCOUNT-PROBE-V04.txt
          if git diff --cached --quiet; then
            echo 'Unchanged APK'
          else
            git commit -m 'Publish verified dual-device read-only Account Probe v0.4'
            git push origin "HEAD:\${GITHUB_REF_NAME}"
          fi
