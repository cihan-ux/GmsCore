name: "Gradle build"
permissions: {}
on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  build:
    name: "Gradle build ${{ matrix.target }}"
    runs-on: ubuntu-latest
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: 1

    strategy:
      matrix:
        target: [Debug, Release]

    steps:
      - name: "Free disk space"
        run: |
          # Deleting unneeded software packages
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go

          # Log available space
          df -h
      - name: "Checkout sources"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: "Setup Java"
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
      - name: "Setup matchers"
        run: |
          # Setting up matchers...

          matchers_dir='${{ github.workspace }}/.github/matchers'
          matcher_list()
          {
            echo 'gradle-build-matcher.json'
            echo 'gradle-build-kotlin-error-matcher.json'
          }

          matcher_list | while IFS='' read -r NAME; do
            if test -f "${matchers_dir:?}/${NAME:?}"; then
              echo "::add-matcher::${matchers_dir:?}/${NAME:?}"
              echo "Matcher configured: ${NAME:?}"
            fi
          done
      - name: "Execute Gradle assemble"
        run: "./gradlew assemble${{ matrix.target }}"
      - name: "Execute Gradle lint"
        run: "./gradlew lint${{ matrix.target }}"

      - name: "Collect experimental Huawei APK"
        if: matrix.target == 'Debug'
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import shutil
          import subprocess

          output_root = Path("play-services-core/build/outputs/apk")
          artifact_root = Path("huawei-debug-artifact")
          artifact_root.mkdir(exist_ok=True)
          collected = []
          for metadata in output_root.rglob("output-metadata.json"):
              data = json.loads(metadata.read_text(encoding="utf-8"))
              if data.get("variantName") != "mapboxHuaweiDebug":
                  continue
              if data.get("applicationId") != "com.google.android.gms":
                  raise SystemExit("Unexpected package ID in Huawei build metadata; refusing to publish")
              for element in data.get("elements", []):
                  filename = element.get("outputFile")
                  if not filename:
                      continue
                  apk = metadata.parent / filename
                  if not apk.is_file():
                      raise SystemExit("Huawei output metadata refers to missing APK: " + filename)
                  destination = artifact_root / apk.name
                  shutil.copy2(apk, destination)
                  digest = hashlib.sha256(destination.read_bytes()).hexdigest()
                  cert_result = subprocess.run(
                      ["keytool", "-printcert", "-jarfile", str(destination)],
                      capture_output=True, text=True, check=True
                  )
                  cert_match = re.search(r"SHA256:\s*([0-9A-Fa-f:]+)", cert_result.stdout)
                  if not cert_match:
                      raise SystemExit("APK signer SHA-256 not found; refusing to publish")
                  signer_sha256 = cert_match.group(1).replace(":", "").lower()
                  collected.append({
                      "file": destination.name,
                      "sha256": digest,
                      "signerCertificateSha256": signer_sha256,
                      "variant": data["variantName"],
                      "applicationId": data["applicationId"],
                      "versionName": data.get("versionName"),
                  })
          if not collected:
              raise SystemExit("No mapboxHuaweiDebug APK was found; refusing to publish a different flavor")
          (artifact_root / "build-manifest.json").write_text(
              json.dumps(collected, indent=2), encoding="utf-8"
          )
          (artifact_root / "DO-NOT-INSTALL-ON-PRIMARY-PHONE.txt").write_text(
              "EXPERIMENTAL BUILD - NOT TESTED ON HUAWEI AQM-LX1.\\n"
              "Not signed with your existing microG signing key.\\n"
              "Do not uninstall your working microG installation to try this build.\\n"
              "This does not enable EMUI signature spoofing or guarantee Chrome login.\\n",
              encoding="utf-8",
          )
          print("Verified Huawei debug outputs:", json.dumps(collected, indent=2))
          PY
      - name: "Upload experimental Huawei APK"
        if: matrix.target == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: microg-huawei-account-visibility-mapbox-debug
          path: huawei-debug-artifact/*
          if-no-files-found: error
          retention-days: 7
