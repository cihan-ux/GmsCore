name: "Gradle build"
permissions: {}
on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  build:
    name: "Gradle build ${{ matrix.target }}"
    runs-on: ubuntu-latest
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: 1

    strategy:
      matrix:
        target: [Debug, Release]

    steps:
      - name: "Free disk space"
        run: |
          # Deleting unneeded software packages
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go

          # Log available space
          df -h
      - name: "Checkout sources"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: "Setup Java"
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
      - name: "Setup matchers"
        run: |
          # Setting up matchers...

          matchers_dir='${{ github.workspace }}/.github/matchers'
          matcher_list()
          {
            echo 'gradle-build-matcher.json'
            echo 'gradle-build-kotlin-error-matcher.json'
          }

          matcher_list | while IFS='' read -r NAME; do
            if test -f "${matchers_dir:?}/${NAME:?}"; then
              echo "::add-matcher::${matchers_dir:?}/${NAME:?}"
              echo "Matcher configured: ${NAME:?}"
            fi
          done
      - name: "Execute Gradle assemble"
        run: "./gradlew assemble${{ matrix.target }}"
      - name: "Execute Gradle lint"
        run: "./gradlew lint${{ matrix.target }}"

      - name: "Collect experimental Huawei APK"
        if: matrix.target == 'Debug'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import shutil

          output_root = Path("play-services-core/build/outputs/apk")
          artifact_root = Path("huawei-debug-artifact")
          artifact_root.mkdir(exist_ok=True)
          collected = []
          for metadata in output_root.rglob("output-metadata.json"):
              data = json.loads(metadata.read_text(encoding="utf-8"))
              if data.get("variantName") != "mapboxHuaweiDebug":
                  continue
              for element in data.get("elements", []):
                  filename = element.get("outputFile")
                  if not filename:
                      continue
                  apk = metadata.parent / filename
                  if apk.is_file():
                      destination = artifact_root / apk.name
                      shutil.copy2(apk, destination)
                      collected.append(str(apk))
          if not collected:
              raise SystemExit("No mapboxHuaweiDebug APK was found; failing rather than uploading a wrong flavor")
          print("Collected Huawei debug variant APK:", *collected, sep="\\n")
          PY
      - name: "Upload experimental Huawei APK"
        if: matrix.target == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: microg-huawei-account-visibility-mapbox-debug
          path: huawei-debug-artifact/*.apk
          if-no-files-found: error
          retention-days: 7
