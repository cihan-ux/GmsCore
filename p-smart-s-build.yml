name: P Smart S - GmsCore Huawei release

# Run manually from the GitHub Actions tab, avoiding unnecessary builds.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-huawei:
    name: Build hmsHuaweiRelease
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: '1'

    steps:
      - name: Check out GmsCore source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Huawei (-hw) release APK
        run: |
          chmod +x ./gradlew
          touch local.properties
          ./gradlew :play-services-core:assembleHmsHuaweiRelease --no-daemon --max-workers=2

      - name: Display APK checksums
        run: |
          find play-services-core/build/outputs/apk/hmsHuawei/release \
            -maxdepth 1 -type f -name '*.apk' -print -exec sha256sum {} \;

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: PSmartS-GmsCore-hw-release-${{ github.run_number }}
          path: play-services-core/build/outputs/apk/hmsHuawei/release/*.apk
          if-no-files-found: error
          retention-days: 7
